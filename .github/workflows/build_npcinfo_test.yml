name: Build NPC Info Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - npc-update

env:
  SOLUTION_FILE_PATH: ./Zeal.sln

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Get short commit hash
        id: git
        shell: bash
        run: echo "short_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build x86 Release
        shell: pwsh
        env:
          ZEAL_BUILD_VERSION: NPCINFO-${{ steps.git.outputs.short_hash }}
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x86 /p:zeal_build_version=$env:ZEAL_BUILD_VERSION /p:LanguageStandard=stdcpp20 $env:SOLUTION_FILE_PATH /p:ExportHeader="" /p:ScanDependencies=""

      - name: Package test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item ./Release/Zeal.asi ./artifact/Zeal.asi
          if (Test-Path ./Release/Zeal.pdb) { Copy-Item ./Release/Zeal.pdb ./artifact/Zeal.pdb }
          Copy-Item ./Zeal/uifiles ./artifact/uifiles -Recurse
          @"
          Zeal NPC Info test build

          Commands:
            /npcnames status
            /npcnames roles
            /npcnames faction
            /npcnames on
            /npcnames off
            /npcnames clear

          Role labels are automatic for Banker, Merchant, and class trainers/guildmasters.
          Faction colours are learned only from normal /consider results in this first test build.
          Zeal does NOT automatically consider NPCs or generate extra consider traffic.
          "@ | Set-Content ./artifact/NPCINFO_TEST.txt

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeal-npcinfo-test-${{ steps.git.outputs.short_hash }}
          path: artifact
          if-no-files-found: error
