name: Build NPC Info Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - npc-update

env:
  SOLUTION_FILE_PATH: ./Zeal.sln

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Get short commit hash
        id: git
        shell: bash
        run: echo "short_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build x86 Release
        shell: pwsh
        env:
          ZEAL_BUILD_VERSION: NPCINFO-${{ steps.git.outputs.short_hash }}
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x86 /p:zeal_build_version=$env:ZEAL_BUILD_VERSION /p:LanguageStandard=stdcpp20 $env:SOLUTION_FILE_PATH /p:ExportHeader="" /p:ScanDependencies=""

      - name: Upload Zeal.asi only
        uses: actions/upload-artifact@v4
        with:
          name: Zeal-ASI-${{ steps.git.outputs.short_hash }}
          path: ./Release/Zeal.asi
          if-no-files-found: error
